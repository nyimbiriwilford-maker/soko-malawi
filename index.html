<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Soko Malawi — Buy, Sell, Find Jobs & Services</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f6f8f7" />
    <style>
      .app-loader-pre {
        position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #f6f8f7; overflow: hidden; overscroll-behavior: none; z-index: 9999;
        padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box; touch-action: none;
      }
      .soko-ring { animation: sokoSpin 1.6s linear infinite; }
      .soko-seg { fill: none; stroke-width: 5; stroke-linecap: round; transform-origin: 32px 32px; stroke-dasharray: 46.08 92.15; animation: sokoBreak 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .soko-seg.s1 { stroke: #0F9D58; transform: rotate(-90deg); }
      .soko-seg.s2 { stroke: #34c77a; transform: rotate(30deg); }
      .soko-seg.s3 { stroke: #F9AB00; transform: rotate(150deg); }
      @keyframes sokoSpin { to { transform: rotate(360deg); } }
      @keyframes sokoBreak {
        0%, 20% { stroke-dasharray: 46.08 92.15; stroke-dashoffset: 0; }
        50%, 65% { stroke-dasharray: 14 124.23; stroke-dashoffset: -16.04; }
        95%, 100% { stroke-dasharray: 46.08 92.15; stroke-dashoffset: 0; }
      }
      .soko-loader-label { font-size: 13px; font-weight: 600; color: #6b7280; letter-spacing: 0.2px; }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SokoMw" />

    <!-- SEO -->
    <meta name="description" content="Soko Malawi — the easiest way to buy, sell, find jobs and services in Malawi." />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soko-malawi.vercel.app" />
    <meta property="og:title" content="Soko Malawi — Buy, Sell, Find Jobs & Services" />
    <meta property="og:description" content="Soko Malawi — the easiest way to buy, sell, find jobs and services in Malawi." />
    <meta property="og:image" content="https://soko-malawi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_MW" />
    <meta property="og:site_name" content="Soko Malawi" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soko Malawi — Buy, Sell, Find Jobs & Services" />
    <meta name="twitter:description" content="Soko Malawi — the easiest way to buy, sell, find jobs and services in Malawi." />
    <meta name="twitter:image" content="https://soko-malawi.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root">
      <div class="app-loader-pre">
        <div style="font-family:'Sora','Inter',system-ui,sans-serif;font-size:28px;font-weight:800;color:#0F9D58;letter-spacing:-0.5px;line-height:1.1;margin-bottom:28px;">
          Soko<span style="color:#F9AB00">Mw</span>
        </div>
        <svg class="soko-ring" width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="soko-seg s1" cx="32" cy="32" r="22" />
          <circle class="soko-seg s2" cx="32" cy="32" r="22" />
          <circle class="soko-seg s3" cx="32" cy="32" r="22" />
        </svg>
        <div class="soko-loader-label">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
