<!doctype html>
<html lang="en" class="has-preloader">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Soko Malawi — Buy, Sell, Find Jobs & Services</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f6f8f7" />
    <style>
      .app-loader-pre {
        position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(60% 40% at 50% 46%, #eaf6ef 0%, #f6f8f7 70%); overflow: hidden; overscroll-behavior: none; z-index: 9999;
        padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box; touch-action: none;
      }
      .soko-glow { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(15,157,88,0.14) 0%, rgba(15,157,88,0) 68%); animation: skGlow 2.4s ease-in-out infinite; pointer-events: none; }
      .soko-mark { position: relative; overflow: visible; }
      .sk-track { fill: none; stroke: rgba(15,157,88,0.10); stroke-width: 5; }
      .sk-outer { transform-origin: 36px 36px; animation: skSpin 1.8s linear infinite; }
      .sk-inner { transform-origin: 36px 36px; animation: skSpinRev 3.2s linear infinite; }
      .sk-inner-arc { fill: none; stroke: rgba(15,157,88,0.28); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 22 135; }
      .sk-seg { fill: none; stroke-width: 5; stroke-linecap: round; transform-origin: 36px 36px; stroke-dasharray: 64.9 129.8; animation: skBreak 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .sk-seg.sk1 { transform: rotate(-90deg); }
      .sk-seg.sk2 { transform: rotate(30deg); }
      .sk-seg.sk3 { transform: rotate(150deg); }
      .sk-core { transform-origin: 36px 36px; animation: skPulse 2.4s ease-in-out infinite; filter: drop-shadow(0 2px 6px rgba(15,157,88,0.22)); }
      .soko-loader-label { font-size: 13px; font-weight: 600; color: #5f6368; letter-spacing: 0.3px; margin-top: 4px; }
      .soko-dots i { font-style: normal; animation: skDot 1.2s infinite; opacity: 0.25; }
      .soko-dots i:nth-child(2) { animation-delay: 0.2s; }
      .soko-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes skSpin { to { transform: rotate(360deg); } }
      @keyframes skSpinRev { to { transform: rotate(-360deg); } }
      @keyframes skBreak {
        0%, 18% { stroke-dasharray: 64.9 129.8; stroke-dashoffset: 0; }
        50%, 64% { stroke-dasharray: 20 174.7; stroke-dashoffset: -22.5; }
        94%, 100% { stroke-dasharray: 64.9 129.8; stroke-dashoffset: 0; }
      }
      @keyframes skPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      @keyframes skGlow { 0%, 100% { opacity: 0.55; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes skDot { 0%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
      @keyframes skFadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SokoMw" />

    <!-- SEO -->
    <meta name="description" content="Soko Malawi — the easiest way to buy, sell, find jobs and services in Malawi." />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soko-malawi.vercel.app" />
    <meta property="og:title" content="Soko Malawi — Buy, Sell, Find Jobs & Services" />
    <meta property="og:description" content="Soko Malawi — the easiest way to buy, sell, find jobs and services in Malawi." />
    <meta property="og:image" content="https://soko-malawi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_MW" />
    <meta property="og:site_name" content="Soko Malawi" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soko Malawi — Buy, Sell, Find Jobs & Services" />
    <meta name="twitter:description" content="Soko Malawi — the easiest way to buy, sell, find jobs and services in Malawi." />
    <meta name="twitter:image" content="https://soko-malawi.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root">
      <div class="app-loader-pre">
        <div style="font-family:'Sora','Inter',system-ui,sans-serif;font-size:28px;font-weight:800;color:#0F9D58;letter-spacing:-0.5px;line-height:1.1;margin-bottom:28px;">
          Soko<span style="color:#F9AB00">Mw</span>
        </div>
        <div class="soko-glow" aria-hidden="true"></div>
        <svg class="soko-mark" width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
          <defs>
            <linearGradient id="sk-g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stopColor="#0F9D58" /><stop offset="1" stopColor="#34c77a" />
            </linearGradient>
            <linearGradient id="sk-g2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stopColor="#34c77a" /><stop offset="1" stopColor="#0F9D58" stopOpacity="0.55" />
            </linearGradient>
            <linearGradient id="sk-g3" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stopColor="#F9AB00" /><stop offset="1" stopColor="#ffd05a" />
            </linearGradient>
          </defs>
          <circle class="sk-track" cx="36" cy="36" r="31" />
          <g class="sk-inner">
            <circle class="sk-inner-arc" cx="36" cy="36" r="25" />
          </g>
          <g class="sk-outer">
            <circle class="sk-seg sk1" cx="36" cy="36" r="31" stroke="url(#sk-g1)" />
            <circle class="sk-seg sk2" cx="36" cy="36" r="31" stroke="url(#sk-g2)" />
            <circle class="sk-seg sk3" cx="36" cy="36" r="31" stroke="url(#sk-g3)" />
          </g>
          <g class="sk-core">
            <circle cx="36" cy="36" r="15" fill="#ffffff" />
            <text x="36" y="42.2" textAnchor="middle" fontFamily="Sora, Inter, system-ui, sans-serif" fontSize="18" fontWeight="800" fill="#0F9D58">S</text>
          </g>
        </svg>
        <div class="soko-loader-label">Loading…<span class="soko-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
