    <style>
      html, body { background: #f6f8f7; margin: 0; }
      .soko-glow { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(15,157,88,0.14) 0%, rgba(15,157,88,0) 68%); animation: skGlow 2.4s ease-in-out infinite; pointer-events: none; }
      .soko-mark { position: relative; overflow: visible; }
      .sk-track { fill: none; stroke: #0F9D58; stroke-opacity: 0.10; stroke-width: 5; stroke-linecap: round; }
      .sk-outer { transform-origin: 36px 36px; animation: skSpin 1.8s linear infinite; }
      .sk-inner { transform-origin: 36px 36px; animation: skSpinRev 3.2s linear infinite; }
      .sk-inner-arc { fill: none; stroke: #0F9D58; stroke-opacity: 0.28; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 22 135; }
      .sk-seg { fill: none; stroke-width: 5; stroke-linecap: round; transform-origin: 36px 36px; stroke-dasharray: 64.9 129.8; animation: skBreak 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .sk-seg.sk1 { stroke: #0F9D58; transform: rotate(-90deg); }
      .sk-seg.sk2 { stroke: #34c77a; transform: rotate(30deg); }
      .sk-seg.sk3 { stroke: #F9AB00; transform: rotate(150deg); }
      .sk-core { transform-origin: 36px 36px; animation: skPulse 2.4s ease-in-out infinite; filter: drop-shadow(0 2px 6px rgba(15,157,88,0.22)); }
      .soko-loader-label { font-size: 13px; font-weight: 600; color: #5f6368; letter-spacing: 0.3px; margin-top: 0; }
      .soko-dots i { font-style: normal; animation: skDot 1.2s infinite; opacity: 0.25; }
      .soko-dots i:nth-child(2) { animation-delay: 0.2s; }
      .soko-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes skSpin { to { transform: rotate(360deg); } }
      @keyframes skSpinRev { to { transform: rotate(-360deg); } }
      @keyframes skBreak {
        0%, 18% { stroke-dasharray: 64.9 129.8; stroke-dashoffset: 0; }
        50%, 64% { stroke-dasharray: 20 174.7; stroke-dashoffset: -22.5; }
        94%, 100% { stroke-dasharray: 64.9 129.8; stroke-dashoffset: 0; }
      }
      @keyframes skPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      @keyframes skGlow { 0%, 100% { opacity: 0.55; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes skDot { 0%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
      @keyframes skFadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>

  <script>
    window.__hideBootLoader = function() {
      var el = document.getElementById('boot-loader');
      if (!el || el.dataset.hiding) return;
      el.dataset.hiding = '1';
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) { el.remove(); return; }
      el.style.transition = 'opacity 0.25s ease';
      el.style.opacity = '0';
      setTimeout(function(){ if (el.parentNode) el.remove(); }, 260);
    };
  </script>
  <script>
    (function() {
      var t = setTimeout(function() {
        var el = document.getElementById('boot-loader');
        if (!el) return;
        if (el.querySelector('.boot-reload')) return;
        var btn = document.createElement('button');
        btn.className = 'boot-reload';
        btn.textContent = 'Reload';
        btn.style.cssText = 'margin-top:12px;background:#0F9D58;color:#fff;border:none;border-radius:12px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;';
        btn.onclick = async function() {
          try {
            if ('serviceWorker' in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function(r){return r.unregister();}));
            }
          } catch(e){}
          try {
            if (window.caches) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function(k){return caches.delete(k);}));
            }
          } catch(e){}
          try { sessionStorage.removeItem('chunk-reloaded'); } catch(e){}
          window.location.reload();
        };
        el.appendChild(btn);
      }, 8000);
      window.__bootLoaderTimer = t;
    })();
  </script>
